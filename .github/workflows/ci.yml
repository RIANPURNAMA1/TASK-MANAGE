name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nexus
          MYSQL_DATABASE: nexustask
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -pnexus" --health-interval 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:nexus@localhost:3306/nexustask
      WEB_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-chars
      COOKIE_SECRET: ci-cookie-secret-that-is-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexus/db exec prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true
