name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nexus
          MYSQL_DATABASE: nexustask
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -pnexus" --health-interval 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:nexus@localhost:3306/nexustask
      WEB_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-chars
      COOKIE_SECRET: ci-cookie-secret-that-is-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec -w @nexus/db -- prisma migrate deploy
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
